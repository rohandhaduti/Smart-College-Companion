{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="{% static 'css/staff.css' %}">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change password</title>
    <style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(rgb(196, 47, 90),rgb(223, 127, 92));
    font-family:Arial;
}
form{
    background:#fff;
    padding:20px;
    width:100%;
    max-width:360px;
    border-radius:8px;
}
h2{
    text-align:center;
    margin-bottom:15px;
}
input{
    width:95%;
    padding:10px;
    margin-bottom:12px;
    border:1px solid #ccc;
    border-radius:5px;
}
input[type=submit]{
    background:#1e3a8a;
    width:102%;
    margin-top:20px;
    color:#fff;
    border:none;
    cursor:pointer;
}
input[type=submit]:hover{
    background:#1e40af;
}
</style>
</head>
<body>
    <form method="POST">
        {% csrf_token %}
        <h2>Change password</h2>
        <input type="text" placeholder="User Name"><br>
        <input type="password" placeholder="Old password" name="t1"><br>
        <input type="password" name="t2" placeholder="New password"><br>
        <input type="password" name="t3" placeholder="Confirm password"><br>
        <a href="{% url 'changepassword' %}"><input type="submit" value="Change"></a>
    </form>
</body>
</html>
