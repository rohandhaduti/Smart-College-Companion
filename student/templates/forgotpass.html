{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="{% static 'css/staff.css' %}">

    <meta charset="UTF-8">
    <title>Forgot password</title>
    <style>
        body{
            background-color: rgb(166, 166, 194);
        }
        .form-container{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        form{
            margin-top: 150px;
            width: 350px;
            max-width: 100%;
            height: 220px;
            background-color: white;
            border: 2px solid white;
            border-radius: 20px;
        }
        h2{text-align: center;
        color: brown;}

        input{
            width:290px;
            padding: 8px;
            margin: 8px 15px;
        }
        input[type='submit']{
            background-color: green;
            margin: 30px 15px;
            width: 305px;
            border: none;
        }
        input[type='submit']:hover{
            background-color: rgb(34, 79, 167);
        }
    </style>
</head>
<body>
<div class="form-container">
    <form method="POST">
        {% csrf_token %}
        <h2>Forgot Password</h2>
        <input type="text" name="t1" placeholder="Enter User name"><br>
        <a href="login"><input type="submit" value="Next"></a>
    </form>
</div>
</body>
</html>
