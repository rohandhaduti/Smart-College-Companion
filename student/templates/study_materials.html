{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Study Materials</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --orange: #FF7B00;

  /* 🔥 NEW SIDEBAR BACKGROUND */
  --sidebar-bg: linear-gradient(180deg, #1e293b, #0f172a, #020617);

  /* Hover & borders */
  --sidebar-hover: rgba(255, 123, 0, 0.12);
  --sidebar-border: rgba(255, 255, 255, 0.08);

  /* Text */
  --text-main: #e2e8f0;
  --text-light: #94a3b8;

  /* Accent */
  --accent-gradient: linear-gradient(135deg, #FF7B00, #ff4500);
}

/* ================================
   SIDEBAR MAIN
================================ */
.sidebar {
  width: 250px;
  height: 100vh;
  background: var(--sidebar-bg);
  position: fixed;
  top: 0;
  left: 0;
  color: var(--text-main);
  overflow-y: auto;
  z-index: 100;

  /* ✨ Glass + depth */
  backdrop-filter: blur(12px);
  box-shadow: 4px 0 25px rgba(0, 0, 0, 0.6);
  border-right: 1px solid var(--sidebar-border);

  transition: all 0.3s ease;
}

/* ================================
   LOGO
================================ */
.sidebar h1 {
  text-align: center;
  padding: 25px 0 15px;
  font-size: 2.2rem;
  font-weight: 800;
  letter-spacing: 2px;
  color: white;
}

/* ================================
   WELCOME BOX
================================ */
.welcome-box {
  background: var(--accent-gradient);
  margin: 15px;
  padding: 16px;
  border-radius: 14px;
  text-align: center;
  color: white;

  /* glow */
  box-shadow: 0 6px 20px rgba(255, 123, 0, 0.4);
}

.welcome-box h3 {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 5px;
  opacity: 0.9;
}

.welcome-box p {
  font-size: 1rem;
  font-weight: 600;
}

/* ================================
   MENU
================================ */
.sidebar ul {
  list-style: none;
  padding: 0 10px;
  margin: 0;
}

.sidebar ul li a {
  color: var(--text-light);
  text-decoration: none;
  padding: 12px 15px;
  display: flex;
  align-items: center;
  font-size: 0.95rem;
  font-weight: 500;
  border-radius: 10px;
  margin-bottom: 6px;

  transition: all 0.25s ease;
}

/* ICON */
.sidebar ul li a i {
  width: 26px;
  font-size: 1.1rem;
  color: var(--orange);
  transition: 0.3s;
}

/* HOVER */
.sidebar ul li a:hover {
  background: var(--sidebar-hover);
  color: white;
  transform: translateX(6px);
}

/* ICON HOVER */
.sidebar ul li a:hover i {
  transform: scale(1.15);
}

/* ACTIVE LINK */
.sidebar ul li a.active {
  background: rgba(255, 123, 0, 0.2);
  color: white;
  font-weight: 600;
}

/* ================================
   LOGOUT
================================ */
.logout-btn {
  padding: 15px;
  margin-top: 20px;
  border-top: 1px solid var(--sidebar-border);
}

.logout-btn a {
  color: #fca5a5;
  text-decoration: none;
  font-size: 0.95rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  border-radius: 10px;
  transition: 0.3s;
}

/* LOGOUT HOVER */
.logout-btn a:hover {
  background: rgba(244, 63, 94, 0.2);
  color: #f43f5e;
  transform: translateX(5px);
}

/* ================================
   MAIN CONTENT SHIFT
================================ */
.main-content {
  margin-left: 250px;
  padding: 40px;
}

/* ================================
   RESPONSIVE
================================ */
@media(max-width: 768px) {
  .sidebar {
    width: 70px;
  }

  .sidebar h1,
  .welcome-box h3,
  .welcome-box p,
  .sidebar ul li a span {
    display: none;
  }

  .sidebar ul li a {
    justify-content: center;
  }

  .sidebar ul li a i {
    margin: 0;
    font-size: 1.4rem;
  }

  .main-content {
    margin-left: 70px;
    padding: 20px;
  }
}
/* BODY */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6f9;
}

/* MAIN CONTENT (sidebar handled in staff.css) */
.main-content {
    padding: 40px;
}

/* GLASS CONTAINER */
.container {
    max-width: 900px;
    margin: auto;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    padding: 35px 40px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

/* TITLE */
.title {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 25px;
    color: #1e293b;
}

/* GRID */
.user-details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

/* INPUT BOX */
.input-box {
    display: flex;
    flex-direction: column;
}

.input-box span {
    font-weight: 600;
    margin-bottom: 6px;
    color: #475569;
}

/* INPUTS */
.input-box input,
.input-box select {
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 14px;
    background: #fff;
    transition: 0.3s;
}

/* FOCUS EFFECT */
.input-box input:focus,
.input-box select:focus {
    border-color: #FF7B00;
    outline: none;
    box-shadow: 0 0 6px rgba(255,123,0,0.3);
}

/* FILE INPUT */
.file-box {
    grid-column: span 2;
}

.file-box input {
    padding: 10px;
    background: #f8fafc;
}

/* FULL WIDTH */
.full-width {
    grid-column: span 2;
}

/* BUTTON */
.button {
    margin-top: 25px;
    text-align: center;
}

.button input {
    padding: 12px 35px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #FF7B00, #ff4500);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

/* BUTTON HOVER */
.button input:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255,123,0,0.4);
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .user-details {
        grid-template-columns: 1fr;
    }

    .full-width,
    .file-box {
        grid-column: span 1;
    }
}

</style>
</head>

<body>

{% include 'staff_menu.html' %}

<div class="main-content">
<div class="container">

<div class="title">Upload Study Materials</div>

<form method="POST" enctype="multipart/form-data">
{% csrf_token %}

<div class="user-details">

<div class="input-box">
<span>Material ID</span>
<input type="text" name="t1" value="{{material_id}}" required readonly>
</div>

<div class="input-box">
<span>Title</span>
<input type="text" name="t2" required>
</div>

<div class="input-box full-width">
<span>Description</span>
<input type="text" name="t3" required>
</div>


<div class="input-box">
    <span>Subject</span>
    <input type="text" name="t4" required value="{{ instructor.subject }}" readonly>
</div>

<div class="input-box">
<span>Semester</span>
<input type="text" name="t5" required value="{{instructor.sem}}" readonly>
</div>

<div class="input-box">
    <span>Instructor Name</span>
    <input type="text" name="t6" required value="{{ instructor.name }}" readonly>
</div>


<div class="input-box">
<span>Upload Date</span>
<input type="date" name="t8" required>
</div>

<div class="input-box file-box">
<span>Attach File</span>
<input type="file" name="myfile" required>
</div>

</div>

<div class="button">
<input type="submit" value="SUBMIT">
</div>

</form>

</div>
</div>

</body>
<script>
document.addEventListener("DOMContentLoaded", function () {
    let today = new Date().toISOString().split('T')[0];

    let dateField = document.querySelector('input[name="t8"]');

    dateField.value = today;     // auto fill today
    dateField.min = today;       // no old dates
    dateField.max = today;       // no future dates
});
</script>
</html>
