{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assignment Submission</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --blue: #934abe;
  --sidebar-bg: rgba(10, 10, 15, 0.95);
  --card-bg: rgba(255, 255, 255, 0.96);
  --text-main: #333;
  --text-light: #f8f9fa;
  --accent-grad:linear-gradient(135deg, #934abe, #f74bfa);
  --accent-gradient: linear-gradient(-135deg, #934abe, #f74bfa);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #f4f7f6;
  color: var(--text-main);
}

/* Sidebar */
.sidebar { 
  width: 250px; 
  height: 100vh; 
  background: var(--sidebar-bg); 
  position: fixed; 
  top: 0; left: 0;
  color: white; 
}

/* Main Content */
.main-content {
  margin-left: 250px;
  padding: 40px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* Card Container */
.form-container {
  width: 100%;
  max-width: 500px;
  background: var(--card-bg);
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

/* Title */
h1 {
  text-align: center;
  margin-bottom: 20px;
  color: #ef3479;
}

h1::after {
  content: '';
  width: 60px;
  height: 4px;
  background: var(--accent-gradient);
  display: block;
  margin: 10px auto;
  border-radius: 2px;
}

/* Inputs */
input[type="text"],
input[type="date"],
input[type="file"] {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 0.95rem;
  outline: none;
}

input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 8px rgba(255,123,0,0.2);
}

label {
  font-weight: 600;
  font-size: 0.9rem;
  margin-bottom: 6px;
  display: block;
  color: black;
}

/* Button */
input[type="submit"] {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: var(--accent-grad);
  color: white;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

input[type="submit"]:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 15px rgba(255,123,0,0.4);
  --accent-gradient: linear-gradient(-135deg, #934abe, #f74bfa);

}

/* Success Message */
.success-msg {
  color: green;
  text-align: center;
  margin-bottom: 15px;
  font-weight: 600;
}

/* Responsive */
@media(max-width:768px){
  .sidebar { width: 70px; }
  .main-content { margin-left: 70px; padding: 20px; }
}

</style>
</head>

<body>

{% include 'student_menu.html' %}

<div class="main-content">

  <div class="form-container">

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <h1>Assignment Submission</h1>

      {% if msg %}
      <div class="success-msg">{{ msg }}</div>
      {% endif %}

      <label>Assignment ID</label>
      <input type="text" name="t1" required pattern="[0-9]+">

      <label>Student ID</label>
      <input type="text" name="t2" value="{{ request.session.user_id }}" readonly>
 
      <label>Attach File</label>
      <input type="file" name="myfile" required>

      <label>Submitted Date</label>
      <input type="date" name="t4" required>

      <label>Status</label>
      <input type="text" name="t5" value="Submitted" readonly>

      <input type="submit" value="Submit Assignment">

    </form>

  </div>

</div>

</body>
</html>
