{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Department Details</title>
    <link rel="stylesheet" href="{% static 'css/staff.css' %}">

     <style>
        body {
            font-family: Arial, sans-serif;
            background-color:pink;
            margin: 0px;
            padding: 0px;
        }
        .sidebar{
            height: 100vh;
            width: 250px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: rgba(0,0,0,0.8);
            padding-top: 20px;
        }

        .sidebar h1{
            color:white;
            text-align:center;
        }

        .welcome{
            background-color:#ff7b00;
            margin: 15px;
            padding: 10px;
            border-radius: 15px;
            color: white;
            text-align: center;
        }

        ul{
            padding: 0;
        }

        ul li{
            list-style: none;
        }

        ul li a{
            color:white;
            padding: 12px 20px;
            display: block;
            text-decoration: none;
        }

        ul li:hover a{
            background-color: #ff7b00;
        }
        .sidebar ul li a i { width:22px; margin-right:10px; color:var(--orange); }

        h3 {
            text-align: center;
            margin-bottom: 15px;

        }
        .table{
            margin-left: 170px;
        }

        table {
            width: 60%;
            margin: auto;
            border-collapse: collapse;
            background: #fff;
        }

        th, td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ccc;
        }

        th {
            background: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        tr:hover {
            background: #e6f2ff;
        }

        .delete-btn {
            color: red;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
{% include 'staff_menu.html' %}
<form>
    <div class="table">
        <table border="2">
            <h3> Department Details </h3>
        <tr>
             <td>Department id</td>
            <td> Department name</td>
            <td> HOD </td>

        </tr>
        {% for i in userdict %}
         <tr>
             <td> {{ i.department_id }} </td>
            <td> {{ i.dept_name }} </td>
            <td>{{ i.hod }} </td>
        {% endfor %}
          </tr>
        </table>
        </div>
    </form>
</body>
</html>
