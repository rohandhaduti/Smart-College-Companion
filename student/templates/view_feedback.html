{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback Details</title>


    <style>
        :root {
  --orange: #FF7B00;

  /* 🔥 NEW SIDEBAR BACKGROUND */
  --sidebar-bg: linear-gradient(180deg, #1e293b, #0f172a, #020617);

  /* Hover & borders */
  --sidebar-hover: rgba(255, 123, 0, 0.12);
  --sidebar-border: rgba(255, 255, 255, 0.08);

  /* Text */
  --text-main: #e2e8f0;
  --text-light: #94a3b8;

  /* Accent */
  --accent-gradient: linear-gradient(135deg, #FF7B00, #ff4500);
}

/* ================================
   SIDEBAR MAIN
================================ */
.sidebar {
  width: 250px;
  height: 100vh;
  background: var(--sidebar-bg);
  position: fixed;
  top: 0;
  left: 0;
  color: var(--text-main);
  overflow-y: auto;
  z-index: 100;

  /* ✨ Glass + depth */
  backdrop-filter: blur(12px);
  box-shadow: 4px 0 25px rgba(0, 0, 0, 0.6);
  border-right: 1px solid var(--sidebar-border);

  transition: all 0.3s ease;
}

/* ================================
   LOGO
================================ */
.sidebar h1 {
  text-align: center;
  padding: 25px 0 15px;
  font-size: 2.2rem;
  font-weight: 800;
  letter-spacing: 2px;
  color: white;
}

/* ================================
   WELCOME BOX
================================ */
.welcome-box {
  background: var(--accent-gradient);
  margin: 15px;
  padding: 16px;
  border-radius: 14px;
  text-align: center;
  color: white;

  /* glow */
  box-shadow: 0 6px 20px rgba(255, 123, 0, 0.4);
}

.welcome-box h3 {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 5px;
  opacity: 0.9;
}

.welcome-box p {
  font-size: 1rem;
  font-weight: 600;
}

/* ================================
   MENU
================================ */
.sidebar ul {
  list-style: none;
  padding: 0 10px;
  margin: 0;
}

.sidebar ul li a {
  color: var(--text-light);
  text-decoration: none;
  padding: 12px 15px;
  display: flex;
  align-items: center;
  font-size: 0.95rem;
  font-weight: 500;
  border-radius: 10px;
  margin-bottom: 6px;

  transition: all 0.25s ease;
}

/* ICON */
.sidebar ul li a i {
  width: 26px;
  font-size: 1.1rem;
  color: var(--orange);
  transition: 0.3s;
}

/* HOVER */
.sidebar ul li a:hover {
  background: var(--sidebar-hover);
  color: white;
  transform: translateX(6px);
}

/* ICON HOVER */
.sidebar ul li a:hover i {
  transform: scale(1.15);
}

/* ACTIVE LINK */
.sidebar ul li a.active {
  background: rgba(255, 123, 0, 0.2);
  color: white;
  font-weight: 600;
}

/* ================================
   LOGOUT
================================ */
.logout-btn {
  padding: 15px;
  margin-top: 20px;
  border-top: 1px solid var(--sidebar-border);
}

.logout-btn a {
  color: #fca5a5;
  text-decoration: none;
  font-size: 0.95rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  border-radius: 10px;
  transition: 0.3s;
}

/* LOGOUT HOVER */
.logout-btn a:hover {
  background: rgba(244, 63, 94, 0.2);
  color: #f43f5e;
  transform: translateX(5px);
}

/* ================================
   MAIN CONTENT SHIFT
================================ */
.main-content {
  margin-left: 250px;
  padding: 40px;
}

/* ================================
   RESPONSIVE
================================ */
@media(max-width: 768px) {
  .sidebar {
    width: 70px;
  }

  .sidebar h1,
  .welcome-box h3,
  .welcome-box p,
  .sidebar ul li a span {
    display: none;
  }

  .sidebar ul li a {
    justify-content: center;
  }

  .sidebar ul li a i {
    margin: 0;
    font-size: 1.4rem;
  }

  .main-content {
    margin-left: 70px;
    padding: 20px;
  }
}
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f9;
        }

        .main-content {
            padding: 30px;
        }

        h3 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            color: #333;
        }

        .table-container {
            max-width: 900px;
            margin: auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th {
            background: #007bff;
            color: white;
            padding: 12px;
            text-align: center;
        }

        table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        table tr:nth-child(even) {
            background: #f9f9f9;
        }

        table tr:hover {
            background: #eef5ff;
        }

        .no-data {
            text-align: center;
            padding: 20px;
            color: #777;
        }

        /* Grade color */
        .grade-good {
            color: green;
            font-weight: bold;
        }

        .grade-average {
            color: orange;
            font-weight: bold;
        }

        .grade-poor {
            color: red;
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 768px) {
            table th, table td {
                font-size: 12px;
                padding: 8px;
            }
        }
    </style>
</head>

<body>

{% include 'staff_menu.html' %}

<div class="main-content">

    <h3>Feedback Details</h3>

    <div class="table-container">
        <table>
            <tr>
                <th>Instructor ID</th>
                <th>Comments</th>
                <th>Grade</th>
                <th>Given Date</th>
            </tr>

            {% for i in userdict %}
            <tr>
                <td>{{ i.instructor_id }}</td>
                <td>{{ i.comments }}</td>

                <td class="
                    {% if i.grade == 'A' %}grade-good
                    {% elif i.grade == 'B' %}grade-average
                    {% else %}grade-poor
                    {% endif %}
                ">
                    {{ i.grade }}
                </td>

                <td>{{ i.given_date }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="no-data">No feedback available</td>
            </tr>
            {% endfor %}

        </table>
    </div>

</div>

</body>
</html>
